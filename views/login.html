<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - File Manager</title>
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2224%22 font-size=%2224%22>📁</text></svg>">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <span class="brand-icon">📁</span>
      <h1>File Manager</h1>
    </div>

    <div class="card auth-card">
      <h2>Log in</h2>
      <p class="auth-subtitle">Enter your credentials to access your files</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            autocomplete="username" 
            placeholder="e.g. johndoe" 
            required 
            minlength="3" 
            maxlength="30"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            autocomplete="current-password" 
            placeholder="••••••••" 
            required 
            minlength="6" 
            maxlength="72"
          />
        </div>

        <div id="login-error" class="message error hidden" role="alert"></div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">
          <span class="btn-text">Log in</span>
          <span class="btn-spinner hidden"></span>
        </button>

        <p class="auth-toggle">
          Don't have an account? <a href="/register" class="link">Create an account</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Dedicated Login Script -->
  <script src="/js/login.js"></script>
</body>
</html>
