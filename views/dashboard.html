<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2224%22 font-size=%2224%22>📁</text></svg>">
</head>

<body>
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-content">
      <div class="brand">
        <strong>File Manager</strong>
      </div>
      <div class="nav-user">
        <span class="user-text">User: <strong id="username-display">user</strong></span>
        <button type="button" id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Alert Banner -->
    <div id="global-alert" class="alert hidden" role="alert"></div>

    <!-- Upload Section -->
    <section class="panel">
      <div class="panel-header">
        <h3>Upload File</h3>
        <span class="max-size-hint text-muted">(Max 5 MB)</span>
      </div>

      <form id="upload-form" class="upload-form">
        <div class="upload-row">
          <!-- Compact Dropzone / File Picker -->
          <div class="dropzone-compact" id="dropzone">
            <input type="file" id="file-input" class="file-input" />
            <div class="dropzone-label">
              <span><label for="file-input" class="file-browse-link">Choose file</label> or drag here</span>
            </div>
          </div>

          <!-- File Display Name -->
          <div class="input-wrap">
            <input type="text" id="upload-display-name" class="form-input" placeholder="Display name (optional)"
              maxlength="255" />
          </div>

          <!-- Upload Button -->
          <button type="submit" id="upload-btn" class="btn btn-outline" disabled>
            <span class="btn-text">Upload</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </div>

        <!-- Selected File Preview Bar -->
        <div id="selected-file-preview" class="file-preview-bar hidden">
          <span id="preview-filename" class="preview-filename">filename.txt</span>
          <span id="preview-filesize" class="preview-filesize text-muted">0 KB</span>
          <button type="button" id="clear-file-btn" class="btn-clear" title="Remove selection">✕</button>
        </div>

        <div id="upload-message" class="message hidden" role="status"></div>
      </form>
    </section>

    <!-- Files List Section -->
    <section class="panel">
      <div class="panel-header">
        <h3>Stored Files</h3>
        <button type="button" id="refresh-files-btn" class="btn btn-outline btn-sm" title="Refresh">Refresh</button>
      </div>

      <div id="file-list-error" class="message error hidden" role="alert"></div>

      <div id="file-list-loading" class="loading-state hidden">
        <p class="text-muted">Loading files...</p>
      </div>

      <div id="file-list-empty" class="empty-state hidden">
        <p class="text-muted">No files uploaded yet.</p>
      </div>

      <div id="file-table-wrap" class="table-wrap hidden">
        <table class="file-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Size</th>
              <th>Uploaded</th>
              <th class="text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="file-table-body">
            <!-- Dynamically populated rows -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Update File Modal -->
  <dialog id="update-modal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h4>Edit File</h4>
        <button type="button" id="close-update-modal-btn" class="btn-clear" title="Close">✕</button>
      </div>
      <form id="update-form" class="modal-body">
        <input type="hidden" id="update-file-id" />

        <div class="form-group">
          <label for="update-display-name">Display Name</label>
          <input type="text" id="update-display-name" name="display_name" class="form-input" required maxlength="255" />
        </div>

        <div class="form-group">
          <label for="update-file-input">Replace File <span class="text-muted">(optional)</span></label>
          <input type="file" id="update-file-input" class="form-input" />
        </div>

        <div id="update-current-info" class="file-preview-bar">
          <span id="update-icon" class="hidden"></span>
          <span id="update-current-name" class="preview-filename"></span>
          <span id="update-current-meta" class="preview-filesize text-muted"></span>
        </div>

        <div id="update-message" class="message error hidden" role="alert"></div>

        <div class="modal-footer">
          <button type="button" id="cancel-update-btn" class="btn btn-outline btn-sm">Cancel</button>
          <button type="submit" id="save-update-btn" class="btn btn-primary btn-sm">
            <span class="btn-text">Save</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Delete File Modal -->
  <dialog id="delete-modal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h4>Delete File</h4>
      </div>
      <p id="delete-modal-msg" class="text-muted">Are you sure you want to delete this file?</p>
      <div class="modal-footer">
        <button type="button" id="cancel-delete-btn" class="btn btn-outline btn-sm">Cancel</button>
        <button type="button" id="confirm-delete-btn" class="btn btn-danger btn-sm">Delete</button>
      </div>
    </div>
  </dialog>

  <script src="/js/dashboard.js"></script>
</body>

</html>
