<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - File Manager</title>
  <link rel="stylesheet" href="/css/register.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2224%22 font-size=%2224%22>📁</text></svg>">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <span class="brand-icon">📁</span>
      <h1>File Manager</h1>
    </div>

    <div class="card auth-card">
      <h2>Create an account</h2>
      <p class="auth-subtitle">Sign up to securely store and manage your personal files</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            autocomplete="username" 
            placeholder="e.g. johndoe" 
            required 
            minlength="3" 
            maxlength="30"
          />
          <small class="field-hint">3 to 30 characters</small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            autocomplete="new-password" 
            placeholder="••••••••" 
            required 
            minlength="6" 
            maxlength="72"
          />
          <small class="field-hint">6 to 72 characters</small>
        </div>

        <div id="register-error" class="message error hidden" role="alert"></div>

        <button type="submit" id="register-btn" class="btn btn-primary btn-block">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner hidden"></span>
        </button>

        <p class="auth-toggle">
          Already have an account? <a href="/login" class="link">Log in</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Dedicated Register Script -->
  <script src="/js/register.js"></script>
</body>
</html>
